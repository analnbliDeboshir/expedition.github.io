const fish=[["🐟","Кефирный сом","Питается йогуртами и чужими дедлайнами."],["🐠","Арбузный карась","На 97% состоит из лета и мечты о тепле."],["🐡","Шаурмовая иглобрюха","Не отдаёт шаурму. Вообще."],["🦈","Кока-кольная акула","Активна ночью. Сон считает необязательным."],["🐙","Гитарный осьминог","Восемь щупалец, ни одного настроенного аккорда."],["🪼","Полуночная медуза","Светится, когда вокруг тихо."],["🐬","Микки-рыб","Мурлычет и ворует носки."],["🦐","Крошечный креветыч","Уверен, что он главный. Возможно, так и есть."]];
let stage=0,caught=[];
const $=s=>document.querySelector(s);
function button(t,fn,cls=""){return `<button class="${cls}" onclick="${fn}">${t}</button>`}
function draw(tag,title,body,actions){$("#chapter").textContent=tag;$("#progress").style.width=(stage/8*100)+"%";$("#screen").innerHTML=`<div class="tag">${tag}</div>${title}${body}<div class="actions">${actions||""}</div>`}
function go(n){stage=n;render()}
function render(){
if(stage===0){draw("вход в историю","<h1>Вероника, тут кое-что<br>для тебя 🌙</h1>",`<p>Никаких важных разговоров и заданий на хорошее настроение. Просто маленький странный мир, который Димки собрал специально для тебя.</p><div class="art">🌿 🐈 🌙</div><p class="small">Можно выбирать, пропускать этапы и закрыть страницу в любой момент. Тут нет неправильных ответов.</p>`,button("Войти в экспедицию →","go(1)","primary"))}
if(stage===1){draw("01 · начальница экспедиции","<h2>На берегу уже кто-то ждёт</h2>",`<div class="art">🐈</div><p>Это Микки Кишка. Она назначила себя начальницей экспедиции, потому что единственная пришла вовремя.</p><div class="note">Микки: «Мяу. Надо найти редких рыбов. Но сначала официально разрешаю тебе ничего не делать минутку».</div>`,button("Слушаюсь, начальница","go(2)","primary"))}
if(stage===2){draw("02 · выбор маршрута","<h2>Куда отправимся?</h2>","<p>Выбирай место по настроению. Или просто первое понравившееся.</p>",["🌴 Тёплый берег, солнце и пальмы","🌙 Ночной пруд, тихо и спокойно","🎸 Домик, откуда слышна гитара"].map(x=>button(x,"go(3)")).join(""))}
if(stage===3){draw("03 · первая находка","<h2>Кто-то клюнул!</h2>",`<div class="art">〰️🎣〰️</div><p>Выбирай первую редкую рыбову для коллекции.</p><div class="grid">${fish.slice(0,4).map((f,i)=>`<div class="fish"><div class="emoji">${f[0]}</div><b>${f[1]}</b><small>${f[2]}</small><button onclick="catchIt(${i})">Забрать</button></div>`).join("")}</div>`,"")}
if(stage===4){draw("04 · географический отдел","<h2>Микки открыла филиал географии</h2>",`<p>Она считает, что без флагов экспедиция не международная. Это не контрольная, честно.</p><div class="art">🇯🇵</div><p>Как думаешь, чей это флаг?</p>`,["Япония","Италия","Бразилия"].map(x=>button(x,"go(5)")).join(""))}
if(stage===5){draw("05 · гитарная аномалия","<h2>Из кустов доносится музыка</h2>",`<div class="art">🎸✨</div><p>Микки утверждает, что это либо редкая музыкальная рыба, либо Димки опять пытается сыграть что-то героическое.</p>`,button("Проверить, кто там","go(6)","primary")+button("Сделать вид, что так и задумано","go(6)","ghost"))}
if(stage===6){draw("06 · важное открытие","<h2>Есть кое-что важнее рыбов</h2>",`<div class="art">🫶</div><p>Иногда можно устать, закрыться, не хотеть разговаривать и не знать, чего хочется. Не нужно объяснять это идеально и не нужно срочно становиться весёлой.</p><div class="note">Я не хочу вытягивать из тебя ответы или чинить твоё настроение. Просто хочу, чтобы ты знала: ты мне очень важна. Я люблю тебя не только когда ты смеёшься, активная и разговорчивая. Вообще всегда.</div>`,button("Дальше","go(7)","primary"))}
if(stage===7){draw("07 · маленький секрет","<h2>Хочешь оставить Димки сообщение?</h2>",`<p>Хоть одно слово, хоть мем, хоть «отстань, я рыб». Оно не отправится автоматически: если захочешь, скопируешь и отправишь ему. А можно ничего не писать.</p><textarea id="msg" placeholder="Напиши что-нибудь, если хочется…"></textarea>`,button("Скопировать и закончить","copyMsg()","primary")+button("Ничего не писать","go(8)","ghost"))}
if(stage===8)finish();
}
function catchIt(i){caught.push(i);go(4)}
function finish(){draw("финал · найдено главное","<h2>Главная находка — это ты.</h2>",`<p>Рыбовы, конечно, тоже ничего. Но экспедиция вообще-то была придумана ради одного человека.</p><img class="photo" src="${PHOTO}" alt="Вы вместе"><div class="note">Вероника, я люблю тебя. Мне нравится быть рядом с тобой, обнимать тебя, проводить с тобой время и даже слушать, как ты в очередной раз говоришь, что я никогда не говорил, какая ты красивая. Хотя я говорю. И буду говорить снова.</div><p>Тебе не нужно отвечать на это прямо сейчас. Просто знай, что ты важная часть моей жизни. Твоя улыбка для меня много значит, но моя любовь к тебе не зависит от того, улыбаешься ты сегодня или нет.</p>`,`<div class="grid"><button class="primary" onclick="catalog()">Посмотреть всех рыбов 🐟</button><button class="ghost" onclick="restart()">Пройти ещё раз</button></div>`)}
function catalog(){draw("секретный аквариум","<h2>Коллекция редких рыбов</h2>",`<p>Пойманные отмечены ⭐. Остальные просто сегодня не захотели клевать.</p><div class="grid">${fish.map((f,i)=>`<div class="fish"><div class="emoji">${f[0]}</div><b>${f[1]} ${caught.includes(i)?"⭐":""}</b><small>${f[2]}</small></div>`).join("")}</div><p class="small">Микки Кишка подтверждает: коллекция научно сомнительная, но очень ценная.</p>`,button("Вернуться к подарку ♡","finish()","primary"))}
function copyMsg(){let v=$("#msg").value.trim();if(!v){go(8);return}if(navigator.clipboard){navigator.clipboard.writeText(v).then(()=>{alert("Скопировано! Можешь отправить Димки, если захочешь.");go(8)}).catch(()=>{alert("Скопируй текст вручную.");go(8)})}else{alert("Скопируй текст вручную.");go(8)}}
function restart(){caught=[];stage=0;render()}
render();
</script></body></html>
